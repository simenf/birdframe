[project]
name = "birdframe"
version = "0.1.0"
description = "Self-hosted bird detection artwork display for Samsung The Frame"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "cryptography>=43,<46",
  "samsungtvws>=2.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["birdframe*"]

[tool.setuptools.package-data]
birdframe = ["data/*.json"]
